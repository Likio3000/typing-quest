name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Xcode Version
        run: xcodebuild -version
      - name: Run Tests
        run: xcodebuild -project TypingGame.xcodeproj -scheme TypingGame -destination 'platform=macOS,arch=arm64' -derivedDataPath build/DerivedData test
